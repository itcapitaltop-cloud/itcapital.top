[PHP]
post_max_size = 100M
upload_max_filesize = 100M
variables_order = EGPCS

; OPcache для максимальной производительности
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.save_comments=1
opcache.fast_shutdown=1

; JIT отключён: вызывал SIGSEGV воркеров PHP-FPM на PHP 8.4 (постоянные 502).
; Прирост JIT для типичных веб-запросов незначителен, стабильность важнее.
opcache.jit=0
opcache.jit_buffer_size=0

; Realpath cache для faster file lookups
realpath_cache_size=4096K
realpath_cache_ttl=600
