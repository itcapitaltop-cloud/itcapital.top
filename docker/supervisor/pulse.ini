[program:pulse-work]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html
user=sail
command=php artisan pulse:work
autostart=true
autorestart=true
numprocs=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stopwaitsecs=3600

[program:pulse-check]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html
user=sail
command=php artisan pulse:check
autostart=true
autorestart=true
numprocs=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stopwaitsecs=3600
