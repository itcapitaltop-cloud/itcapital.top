services:
  app:
    # Dev Container diagnostics: Vite runs inside the app container, so expose it
    # explicitly for browser access from the host IDE.
    ports:
      - "${VITE_PORT:-5173}:5173"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  pgdb:
    # Dev Container diagnostics: provide a default app database user for the
    # existing init script when a database volume is created for the first time.
    environment:
      APP_DB_USER: "${APP_DB_USER:-itc}"
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:-password}"
    networks:
      net:
        # Dev Container diagnostics: project env files and phpunit.xml use
        # DB_HOST=pgsql, while the Compose service is named pgdb.
        aliases:
          - pgsql
